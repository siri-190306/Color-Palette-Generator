<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Pop 🎨 | Palette Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <p class="tagline">A LITTLE COLOR, A LOT OF CREATIVITY ✨</p>
            <h1>Color Pop 🎨</h1>
            <p class="subtitle">
                Find your next favorite color, one click at a time!
            </p>
        </header>
        <main>
            <div class="palette" id="palette">
            </div>
            <button id="generateBtn">
                🎲 Generate New Palette
            </button>
            <p class="hint">
                💡 Click on any color card to copy its HEX code!
            </p>
        </main>
        <div class="toast" id="toast" role="status"
             aria-live="polite"></div>
        <footer>
            Made with 💗 and a little creativity
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
